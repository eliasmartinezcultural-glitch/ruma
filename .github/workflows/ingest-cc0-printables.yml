name: Incorporar imprimibles CC0
# Importa archivos listos de la fuente original, valida ZIP y PDF, y los guarda localmente.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-cc0-printables.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Descargar colecciones CC0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ruma-packs
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/sudoku-puzzles/Sudoku.Puzzles.Easy.-.25.v1.0.0.zip" -o /tmp/ruma-packs/sudoku.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/crossword-puzzles/Crossword.Puzzle.15x15.v1.0.0.zip" -o /tmp/ruma-packs/crosswords.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/coloring-books/Quote.Coloring.Book.v1.0.0.zip" -o /tmp/ruma-packs/coloring.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/for-writers/Author.Interview.Sheet.v1.0.0.zip" -o /tmp/ruma-packs/author-sheets.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/Mazes/Mazes.v1.0.0.zip" -o /tmp/ruma-packs/mazes-30.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/Mazes/Mazes.2.v1.0.0.zip" -o /tmp/ruma-packs/mazes-15.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/for-readers/Vocabulary.Builder.v1.0.0.zip" -o /tmp/ruma-packs/vocabulary.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/word-puzzles/Word.Search.v1.0.0.zip" -o /tmp/ruma-packs/word-search.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/planners-productivity/Habit.Writing.Streak.Tracker.v1.0.0.zip" -o /tmp/ruma-packs/habit-tracker.zip
          curl --fail --location --retry 3 "https://github.com/dead0eye/free-printable-resources/releases/download/planners-productivity/Weekly.Planner.2026.v1.0.0.zip" -o /tmp/ruma-packs/weekly-planner.zip

      - name: Validar ZIP y extraer muestras PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import zipfile
          from pathlib import Path

          packs = [
              ("/tmp/ruma-packs/sudoku.zip", "archivos/escolar/cc0-sudoku-facil-25.zip", "previews/escolar/cc0-sudoku-muestra.pdf", "Sudoku fácil"),
              ("/tmp/ruma-packs/crosswords.zip", "archivos/escolar/cc0-crucigramas-15x15.zip", "previews/escolar/cc0-crucigramas-muestra.pdf", "Crucigramas 15x15"),
              ("/tmp/ruma-packs/coloring.zip", "archivos/creativa/cc0-libro-colorear-20-citas.zip", "previews/creativa/cc0-colorear-muestra.pdf", "Libro para colorear · 20 citas"),
              ("/tmp/ruma-packs/author-sheets.zip", "archivos/creativa/cc0-fichas-entrevista-autor.zip", "previews/creativa/cc0-entrevista-autor-muestra.pdf", "Fichas de entrevista a autores"),
              ("/tmp/ruma-packs/mazes-30.zip", "archivos/infantil/cc0-laberintos-30.zip", "previews/infantil/cc0-laberintos-30-muestra.pdf", "Laberintos · colección de 30"),
              ("/tmp/ruma-packs/mazes-15.zip", "archivos/infantil/cc0-laberintos-15-adicionales.zip", "previews/infantil/cc0-laberintos-15-muestra.pdf", "Laberintos · 15 adicionales"),
              ("/tmp/ruma-packs/vocabulary.zip", "archivos/escolar/cc0-vocabulario-40-paginas.zip", "previews/escolar/cc0-vocabulario-muestra.pdf", "Vocabulario · 40 páginas"),
              ("/tmp/ruma-packs/word-search.zip", "archivos/escolar/cc0-sopa-de-letras.zip", "previews/escolar/cc0-sopa-de-letras-muestra.pdf", "Sopa de letras · tres variantes"),
              ("/tmp/ruma-packs/habit-tracker.zip", "archivos/personal/cc0-seguimiento-habitos-escritura.zip", "previews/personal/cc0-habitos-muestra.pdf", "Seguimiento de hábitos y escritura"),
              ("/tmp/ruma-packs/weekly-planner.zip", "archivos/personal/cc0-planificador-semanal-oct-dic-2026.zip", "previews/personal/cc0-planificador-semanal-muestra.pdf", "Planificador semanal · octubre a diciembre 2026")
          ]
          manifest = []
          for source, archive_path, preview_path, title in packs:
              archive = Path(source)
              if not archive.exists() or archive.stat().st_size == 0:
                  raise SystemExit(f"Descarga vacía: {archive}")
              with zipfile.ZipFile(archive) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"CRC incorrecto en {archive}: {bad}")
                  pdf_names = []
                  for info in z.infolist():
                      name = info.filename.replace("\\", "/")
                      if info.is_dir():
                          continue
                      if name.startswith("/") or ".." in Path(name).parts:
                          raise SystemExit(f"Ruta insegura en ZIP: {name}")
                      suffix = Path(name).suffix.lower()
                      if suffix == ".pdf":
                          pdf_names.append(info.filename)
                      elif suffix not in {".txt", ".md", ".license", ".json", ".csv"} and Path(name).name != ".DS_Store":
                          raise SystemExit(f"Tipo de archivo inesperado en ZIP: {name}")
                  if not pdf_names:
                      raise SystemExit(f"No se encontraron PDF en {archive}")
                  pdf_names.sort()
                  sample = z.read(pdf_names[0])
                  if not sample.startswith(b"%PDF-") or b"%%EOF" not in sample[-2048:]:
                      raise SystemExit(f"PDF de muestra inválido: {pdf_names[0]}")
                  if len(sample) > 15_000_000:
                      raise SystemExit(f"PDF de muestra demasiado grande: {pdf_names[0]}")
                  destination = Path(archive_path)
                  preview = Path(preview_path)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  preview.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read_bytes())
                  preview.write_bytes(sample)
                  manifest.append({
                      "title": title,
                      "archive": archive_path,
                      "preview": preview_path,
                      "pdf_count": len(pdf_names),
                      "sample": Path(pdf_names[0]).name,
                      "archive_bytes": destination.stat().st_size,
                      "preview_bytes": preview.stat().st_size
                  })
                  print(f"VALIDADO: {title} · {len(pdf_names)} PDF · {destination.stat().st_size} bytes")
          Path("archivos/escolar/cc0-printables-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          PY

      - name: Guardar archivos dentro de RUMA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivos/ previews/
          if git diff --cached --quiet; then
            echo "No hay archivos nuevos para guardar."
            exit 0
          fi
          git commit -m "Ampliar biblioteca con imprimibles CC0"
          git push
