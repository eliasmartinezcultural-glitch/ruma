name: RUMA — publicar lote revisado

on:
  push:
    paths:
      - "investigacion/aprobaciones-lote-01.json"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verificar autorización y copiar solo archivos aprobados
        run: |
          python -m pip install --disable-pip-version-check pypdf
          python - <<'PY'
          import hashlib, io, json, urllib.request, zipfile
          from pathlib import Path
          from pypdf import PdfReader

          manifest_path = Path("investigacion/aprobaciones-lote-01.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          allowed = {
              "laberintos-30": {
                  "url": "https://github.com/dead0eye/free-printable-resources/releases/download/Mazes/Mazes.v1.0.0.zip",
                  "zip_sha256": "22f080228c28777db58b6c0b5289c30661d000a409d639d448fd9634402cfe7c",
                  "inner": "Mazes/mazes_classic_gh-30-huge-looped.pdf",
                  "pdf_sha256": "1f029a6012f66dc6afc527e8e9c58c28fdd0da51f8700ead286eca8626178687",
                  "target": "descargas/30-laberintos-imprimibles.pdf",
              },
              "colorear-literatura": {
                  "url": "https://github.com/dead0eye/free-printable-resources/releases/download/coloring-books/Quote.Coloring.Book.v1.0.0.zip",
                  "zip_sha256": "83d889d2d03b3e1047449cb40a6e2b1ff9e033a8f2f3a482e2f5cd9add6887d3",
                  "inner": "Quote Coloring Book/words-to-colour_classic_20_gh.pdf",
                  "pdf_sha256": "7467714b2ca5da0e5738853e319e14cebdd1569c9821f2824e76f046710083da",
                  "target": "descargas/20-laminas-para-colorear-literatura.pdf",
              },
              "sudoku-variantes": {
                  "url": "https://github.com/dead0eye/free-printable-resources/releases/download/sudoku-puzzles/Sudoku.Puzzles.Easy.-.25.v1.0.0.zip",
                  "zip_sha256": "3a2dde90e80055e7ab4c74e52ff3bbbc809f33e36dc7ed1ef9e5a30d99aac89b",
                  "inner": "Sudoku Puzzles Easy - 25/sudoku_github_standard-diagonal-killer-hyper-thermo_easy_25puzzles_gh.pdf",
                  "pdf_sha256": "450dff1b508230f26901f906a31df33743cc4519ec8bfc8af998b97aed0ebe3a",
                  "target": "descargas/25-sudokus-y-variantes.pdf",
              },
          }
          requested = manifest.get("resources")
          if not isinstance(requested, list) or not requested:
              raise SystemExit("No hay recursos aprobados en el manifiesto.")
          ids = [item.get("id") for item in requested if isinstance(item, dict) and item.get("approved") is True]
          if len(ids) != len(requested) or len(ids) != len(set(ids)):
              raise SystemExit("El manifiesto contiene entradas inválidas o duplicadas.")
          if any(resource_id not in allowed for resource_id in ids):
              raise SystemExit("El manifiesto solicita un recurso que no está en la lista cerrada.")
          for resource_id in ids:
              spec = allowed[resource_id]
              req = urllib.request.Request(spec["url"], headers={"User-Agent": "RUMA-Approved-Publication/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  archive = response.read(20 * 1024 * 1024 + 1)
              if len(archive) > 20 * 1024 * 1024:
                  raise SystemExit(f"{resource_id}: el ZIP excede el límite.")
              if hashlib.sha256(archive).hexdigest() != spec["zip_sha256"]:
                  raise SystemExit(f"{resource_id}: el ZIP no coincide con el archivo inspeccionado.")
              with zipfile.ZipFile(io.BytesIO(archive)) as zf:
                  if spec["inner"] not in zf.namelist():
                      raise SystemExit(f"{resource_id}: no se encontró el PDF esperado.")
                  data = zf.read(spec["inner"])
              if hashlib.sha256(data).hexdigest() != spec["pdf_sha256"]:
                  raise SystemExit(f"{resource_id}: el PDF no coincide con el inspeccionado.")
              reader = PdfReader(io.BytesIO(data), strict=False)
              if reader.is_encrypted or len(reader.pages) < 2:
                  raise SystemExit(f"{resource_id}: PDF cifrado o inesperadamente corto.")
              target = Path(spec["target"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"APROBADO {resource_id}: {target}, {len(data)} bytes, {len(reader.pages)} páginas, SHA-256 {spec['pdf_sha256']}")
          PY

      - name: Guardar archivos dentro de RUMA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/
          if git diff --cached --quiet; then
            echo "No hay archivos nuevos para publicar."
            exit 0
          fi
          git commit -m "Publica lote 01 de recursos revisados"
          git pull --rebase origin main
          git push
