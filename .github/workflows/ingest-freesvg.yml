name: Incorporar recursos públicos verificados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-freesvg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Descargar y validar SVG de FreeSVG
        shell: bash
        run: |
          set -euo pipefail

          download_svg() {
            local id="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "RUMA-resource-library/0.2" \
              "https://freesvg.org/download/$id" \
              --output "$destination"

            python3 - "$destination" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          if not raw or len(raw) > 12_000_000:
              raise SystemExit(f"Archivo vacío o demasiado grande: {path}")
          try:
              root = ET.fromstring(raw)
          except ET.ParseError as exc:
              raise SystemExit(f"No es SVG/XML válido: {path}: {exc}")
          if not root.tag.lower().endswith("svg"):
              raise SystemExit(f"El archivo no tiene raíz SVG: {path}")
          forbidden = {"script", "foreignobject", "iframe", "object", "embed"}
          for node in root.iter():
              tag = node.tag.rsplit("}", 1)[-1].lower()
              if tag in forbidden:
                  raise SystemExit(f"Elemento no permitido ({tag}) en {path}")
              for key, value in node.attrib.items():
                  key = key.rsplit("}", 1)[-1].lower()
                  value = value.strip().lower()
                  if key == "href" and (value.startswith("http:") or value.startswith("https:") or value.startswith("//")):
                      raise SystemExit(f"Referencia externa en {path}")
          print(f"VALIDADO: {path} ({len(raw)} bytes)")
          PY
          }

          download_svg "72497" "archivos/decorativa/freesvg-marco-ornamental-vintage.svg"
          download_svg "1697" "archivos/decorativa/freesvg-patron-floral-continuo.svg"
          download_svg "71038" "archivos/creativa/freesvg-divisor-ornamental-vintage.svg"
          download_svg "41215" "archivos/decorativa/freesvg-borde-floral.svg"

      - name: Guardar archivos en RUMA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivos/
          if git diff --cached --quiet; then
            echo "No hay archivos nuevos para guardar."
            exit 0
          fi
          git commit -m "Incorporar cuatro SVG públicos de FreeSVG"
          git push
