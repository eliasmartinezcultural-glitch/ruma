name: RUMA — inspección lote 03 territorial

on:
  push:
    paths:
      - ".github/workflows/inspeccionar-lote-03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar datos territoriales y capa geográfica en la nube
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request, zipfile
          from pathlib import Path
          out = Path("salida-lote-03")
          out.mkdir(exist_ok=True)
          items = [
            ("instrumentos-provinciales.csv", "https://portaldatosabiertos.neuquen.gov.ar/dataset/0dbeb4cf-3a74-4f64-b676-44522f777582/resource/7f78aa40-dc50-4dc9-adc4-1809bcef3692/download/instrumentos-de-planificacion-provinciales.csv", "CC BY 4.0; COPADE; planificación territorial provincial 2019-2025", "csv"),
            ("instrumentos-gobiernos-locales.csv", "https://portaldatosabiertos.neuquen.gov.ar/dataset/0dbeb4cf-3a74-4f64-b676-44522f777582/resource/332ad11c-0ee8-46bc-9a99-28869578348d/download/instrumentos-de-planificacion-para-gobiernos-locales.csv", "CC BY 4.0; COPADE; planificación territorial por gobierno local 2019-2025", "csv"),
            ("regiones-geojson.zip", "https://portaldatosabiertos.neuquen.gov.ar/dataset/fcbefeef-8fb6-4595-93d8-cff87719388c/resource/ab5006b8-9d19-49cb-a895-e4aa864190c8/download/regiones_geojson.zip", "CC BY 4.0; COPADE; capa geográfica de regiones de Neuquén", "zip"),
          ]
          report = ["# Informe de inspección lote 03", "", "Inspección temporal en la nube. No publicar automáticamente.", ""]
          for filename, url, license_note, kind in items:
            report += [f"## {filename}", "", license_note, f"Origen: {url}", ""]
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"RUMA-OpenData-Review/1.0"})
              with urllib.request.urlopen(req, timeout=40) as r:
                data = r.read(20*1024*1024+1)
              if len(data) > 20*1024*1024:
                raise ValueError("Supera el límite de 20 MiB para inspección automática.")
              report += [f"- Tamaño: {len(data)} bytes", f"- SHA-256: {hashlib.sha256(data).hexdigest()}"]
              (out/filename).write_bytes(data)
              if kind == "csv":
                text = None
                encoding = None
                for enc in ("utf-8-sig","utf-8","cp1252","latin-1"):
                  try: text=data.decode(enc); encoding=enc; break
                  except UnicodeDecodeError: pass
                sample=text[:12000]
                try: delimiter=csv.Sniffer().sniff(sample, delimiters=",;\\t|").delimiter
                except Exception: delimiter=","
                rows=list(csv.reader(io.StringIO(text),delimiter=delimiter))
                report += [f"- Codificación: {encoding}; separador: {repr(delimiter)}",f"- Filas incluyendo encabezado: {len(rows)}",f"- Encabezado: {repr(rows[0] if rows else [])}","- Muestra:"]
                for row in rows[1:6]: report.append("  - "+repr(row[:12]))
              else:
                with zipfile.ZipFile(io.BytesIO(data)) as z:
                  files=z.infolist()
                  report += [f"- ZIP válido: sí; entradas: {len(files)}"]
                  for f in files[:30]: report.append(f"  - {f.filename} ({f.file_size} bytes)")
                  geojsons=[f for f in files if f.filename.lower().endswith((".geojson",".json")) and not f.is_dir()]
                  if geojsons:
                    name=geojsons[0].filename
                    raw=z.read(name)
                    obj=json.loads(raw.decode("utf-8-sig"))
                    report += [f"- GeoJSON inspeccionado: {name}",f"- Tamaño GeoJSON: {len(raw)} bytes",f"- Tipo: {obj.get('type')}",f"- Cantidad de entidades: {len(obj.get('features',[])) if isinstance(obj.get('features'),list) else 'no aplica'}"]
                    if isinstance(obj.get("features"),list) and obj["features"]:
                      report += [f"- Propiedades de ejemplo: {repr(obj['features'][0].get('properties',{}))}"]
                    (out/"regiones-neuquen.geojson").write_bytes(raw)
                  else: report.append("- ALERTA: no se encontró GeoJSON dentro del ZIP.")
            except Exception as e:
              report.append(f"- ERROR: {type(e).__name__}: {e}")
            report.append("")
          (out/"INFORME.md").write_text("\\n".join(report)+"\\n",encoding="utf-8")
          print((out/"INFORME.md").read_text(encoding="utf-8"))
          PY
      - name: Guardar resultados temporales
        uses: actions/upload-artifact@v4
        with:
          name: ruma-lote-03-inspeccion
          path: salida-lote-03/
          retention-days: 7
