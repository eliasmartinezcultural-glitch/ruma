name: RUMA — listado territorial de Argentina

on:
  push:
    paths:
      - ".github/workflows/crear-jurisdicciones-argentina.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Obtener y validar el listado oficial en la nube
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request
          from pathlib import Path
          url="https://apis.datos.gob.ar/georef/api/provincias?campos=id,nombre&max=100"
          req=urllib.request.Request(url,headers={"User-Agent":"RUMA-OpenData-Review/1.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(2_000_000)
          data=json.loads(raw.decode("utf-8"))
          provinces=data.get("provincias")
          if not isinstance(provinces,list) or len(provinces)!=24:
            raise SystemExit(f"Se esperaban 24 jurisdicciones; respuesta: {len(provinces) if isinstance(provinces,list) else 'inválida'}. No publicar.")
          clean=[]
          seen=set()
          for item in provinces:
            ident=str(item.get("id","")).strip()
            name=str(item.get("nombre","")).strip()
            if not ident or not name or ident in seen:
              raise SystemExit(f"Registro inválido o ID duplicado: {item!r}")
            seen.add(ident)
            clean.append((ident,name))
          clean.sort(key=lambda x:x[1].casefold())
          path=Path("descargas/jurisdicciones-de-argentina-georef.csv")
          path.parent.mkdir(exist_ok=True)
          with path.open("w",encoding="utf-8-sig",newline="") as f:
            writer=csv.writer(f,delimiter=";",lineterminator="\n")
            writer.writerow(["id_georef","jurisdiccion"])
            writer.writerows(clean)
          print(f"Fuente: {url}")
          print(f"SHA-256 respuesta API: {hashlib.sha256(raw).hexdigest()}")
          print(f"CSV creado: {path}, {path.stat().st_size} bytes, {len(clean)} registros")
          print("Muestra:",clean[:5])
          PY
      - name: Publicar el CSV territorial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/jurisdicciones-de-argentina-georef.csv
          git commit -m "Añade listado oficial de jurisdicciones argentinas"
          git pull --rebase origin main
          git push
