name: RUMA — inspección de fichas educativas CC BY-SA

on:
  push:
    paths:
      - ".github/workflows/inspeccionar-pdfs-intef.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Descargar e inspeccionar las fichas en la nube
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          import hashlib, urllib.request
          from pathlib import Path
          from pypdf import PdfReader
          out=Path("salida-intef"); out.mkdir(exist_ok=True)
          items=[
            ("ficha-partes-del-cuerpo.pdf","https://descargas.intef.es/recursos_educativos/RED_ES/02_Primaria/1/P_1_004_2025_0202/P_1_004_2025_0202_IL_02025.pdf","PENTEC; recurso Mi cuerpo por dentro y por fuera; CC BY-SA 4.0; fuente de la página de sesión y créditos."),
            ("ficha-descripcion-de-objetos.pdf","https://descargas.intef.es/recursos_educativos/RED_ES/02_Primaria/2/P_2_004_2025_0225/P_2_004_2025_0225_IL_02483.pdf","PENTEC; recurso Los inventos; CC BY-SA 4.0; ficha para describir tres objetos."),
            ("mis-oraciones-con-dados.pdf","https://descargas.intef.es/recursos_educativos/It_didac/Leng_Pri/2/09/La_oracin/MIS_ORACIONES_CON_DADOS.pdf","Área de Recursos Educativos Digitales (INTEF); licencia CC BY-SA 4.0 España declarada en el propio PDF."),
            ("crea-tus-dados.pdf","https://descargas.intef.es/recursos_educativos/It_didac/Leng_Pri/2/09/La_oracin/CREA_TUS_DADOS.pdf","Área de Recursos Educativos Digitales (INTEF); licencia CC BY-SA 4.0 España declarada en el propio PDF.")
          ]
          report=["# Inspección de fichas educativas CC BY-SA 4.0",""]
          for name,url,lic in items:
            report += [f"## {name}",lic,f"Origen: {url}"]
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"RUMA-OpenResource-Review/1.0"})
              with urllib.request.urlopen(req,timeout=40) as r: data=r.read(5_000_000)
              path=out/name; path.write_bytes(data)
              reader=PdfReader(str(path))
              text=" ".join(page.extract_text() or "" for page in reader.pages)
              if len(reader.pages)!=1: raise ValueError(f"Se esperaba 1 página; hay {len(reader.pages)}")
              if len(data)<1000: raise ValueError("Archivo demasiado pequeño")
              report += [f"- Tamaño: {len(data)} bytes",f"- SHA-256: {hashlib.sha256(data).hexdigest()}",f"- Páginas: {len(reader.pages)}",f"- Texto extraído: {text[:500]!r}"]
              if name.startswith("ficha-descripcion") and "Objeto 1" not in text: raise ValueError("No aparece el contenido esperado.")
              if name.startswith("mis-oraciones") and "MIS ORACIONES CON DADOS" not in text: raise ValueError("No aparece el título esperado.")
              if name.startswith("crea-tus-dados") and "CREA TUS DADOS" not in text: raise ValueError("No aparece el título esperado.")
            except Exception as e: report.append(f"- ERROR: {type(e).__name__}: {e}")
            report.append("")
          (out/"INFORME.md").write_text("\\n".join(report)+"\\n",encoding="utf-8")
          print((out/"INFORME.md").read_text(encoding="utf-8"))
          PY
      - name: Guardar resultados temporales
        uses: actions/upload-artifact@v4
        with:
          name: ruma-intef-cc-by-sa-inspeccion
          path: salida-intef/
          retention-days: 7
