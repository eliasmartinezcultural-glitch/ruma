<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fffaf5"/><rect x="38" y="38" width="718" height="1047" rx="26" fill="none" stroke="#c5a38a" stroke-width="3"/><text x="397" y="120" text-anchor="middle" font-family="serif" font-size="37" fill="#855f4c">La luz de la ventana</text><text x="397" y="162" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#a17f6b">Un cuento breve original de RUMA</text><g stroke="#c5a38a" stroke-width="4" fill="none"><rect x="295" y="205" width="205" height="180" rx="5"/><path d="M397 205V385 M295 295H500"/></g><circle cx="440" cy="245" r="23" fill="#efd49a"/><g font-family="serif" font-size="23" fill="#765746"><text x="95" y="455">Cada tarde, cuando el sol bajaba, una</text><text x="95" y="495">ventana se encendía en la casa del final</text><text x="95" y="535">de la calle.</text><text x="95" y="605">Nadie sabía quién vivía allí. Pero una noche</text><text x="95" y="645">de lluvia, una vecina dejó una bolsa con pan</text><text x="95" y="685">en el umbral. Al día siguiente encontró,</text><text x="95" y="725">en su puerta, una maceta con flores.</text><text x="95" y="795">Desde entonces, sin preguntar nombres,</text><text x="95" y="835">las personas de la cuadra empezaron a</text><text x="95" y="875">dejar pequeñas cosas: una sopa, un libro,</text><text x="95" y="915">una nota, una planta.</text><text x="95" y="985">La luz seguía encendida. Y la calle, sin</text><text x="95" y="1025">hacer ruido, se había vuelto más cercana.</text></g></svg>