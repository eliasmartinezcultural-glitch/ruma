<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><title>Casa de viento</title><desc>Lectura breve original de RUMA, descargable e imprimible.</desc><rect width="800" height="1000" fill="#FCFAF5"/><rect x="24" y="24" width="752" height="952" rx="28" fill="#F4E8D9" stroke="#D9DCCD" stroke-width="2"/><text x="55" y="90" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#33483A">Casa de viento</text><path d="M55 115 H745" stroke="#A9B9A2" stroke-width="3"/><g font-family="Georgia,serif" font-size="24" fill="#536458"><text x="60" y="190">El viento conoce los caminos</text><text x="60" y="235">que no aparecen en los mapas,</text><text x="60" y="280">pasa silbando por las bardas</text><text x="60" y="325">y despierta las ventanas.</text><text x="60" y="410">En una casa junto al valle</text><text x="60" y="455">hierve despacio la pava;</text><text x="60" y="500">alguien arrima una silla</text><text x="60" y="545">y comparte lo que guarda.</text><text x="60" y="630">Afuera, la tarde camina.</text><text x="60" y="675">Adentro, el tiempo descansa.</text><text x="60" y="720">Y el viento, que nunca se queda,</text><text x="60" y="765">se lleva un poco de calma.</text><text x="60" y="845" font-size="20">Poema original de RUMA · Para leer en voz alta o regalar.</text></g><text x="55" y="940" font-family="Arial,sans-serif" font-size="16" fill="#718174">RUMA · Lectura original para compartir · Gratis</text></svg>