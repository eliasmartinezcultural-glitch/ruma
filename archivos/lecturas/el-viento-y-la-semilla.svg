<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fffdf7"/><rect x="38" y="38" width="718" height="1047" rx="26" fill="none" stroke="#8aa38b" stroke-width="3"/><circle cx="650" cy="140" r="48" fill="#f1dba1"/><path d="M95 280 Q210 220 330 280 T570 280 T730 280" fill="none" stroke="#b6cbb0" stroke-width="4"/><text x="397" y="145" text-anchor="middle" font-family="serif" font-size="37" fill="#45664a">El viento y la semilla</text><text x="397" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#748b70">Un cuento breve original de RUMA</text><g font-family="serif" font-size="23" fill="#4c5d4b"><text x="95" y="350">Una mañana, el viento encontró una semilla</text><text x="95" y="390">pequeña junto al camino.</text><text x="95" y="460">—¿A dónde vas? —preguntó, soplando suave.</text><text x="95" y="530">—No lo sé —dijo la semilla—. Solo quiero</text><text x="95" y="570">encontrar un lugar donde crecer.</text><text x="95" y="640">El viento la llevó sin apuro hasta un patio.</text><text x="95" y="680">Allí había tierra tibia, agua y alguien que</text><text x="95" y="720">se tomó un momento para cuidarla.</text><text x="95" y="790">Pasaron los días. La semilla abrió sus hojas</text><text x="95" y="830">y descubrió que crecer no era correr, sino</text><text x="95" y="870">recibir un poquito de cuidado cada día.</text><text x="95" y="940">Desde entonces, cuando soplaba el viento,</text><text x="95" y="980">el patio le parecía un lugar enorme.</text></g><path d="M365 1035 Q390 980 415 1035 M390 1030 L390 1060 M390 1040 Q360 1010 350 1035 M390 1040 Q420 1010 430 1035" fill="none" stroke="#71926d" stroke-width="3"/></svg>