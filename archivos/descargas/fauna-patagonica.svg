<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title>Fauna de la Patagonia</title><desc>Lámina original para observar y conocer animales de la región.</desc><rect width="794" height="1123" fill="#fffdf7"/><rect x="28" y="28" width="738" height="1067" rx="28" fill="none" stroke="#b7c9b3" stroke-width="3"/><circle cx="690" cy="100" r="34" fill="#f5dfad"/><path d="M670 105 Q690 60 710 105" fill="none" stroke="#7c9a82" stroke-width="4"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="18" fill="#607b68" letter-spacing="3">RUMA · RUMA ES ACCESO</text><text x="56" y="137" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#334d40">Fauna de la Patagonia</text><line x1="56" y1="160" x2="738" y2="160" stroke="#e3c98e" stroke-width="4"/><text x="56" y="205" font-family="Arial" font-size="20" fill="#506458">Animales que viven en paisajes patagónicos.</text><rect x="56" y="245" width="682" height="155" rx="18" fill="#eaf1e5"/><circle cx="130" cy="321" r="47" fill="#e0c19b"/><text x="130" y="332" text-anchor="middle" font-family="Arial" font-size="34" fill="#334d40">🦙</text><text x="200" y="293" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">GUANACO</text><text x="200" y="327" font-family="Arial" font-size="17" fill="#506458">Herbívoro de cuello largo. Vive en grupos y corre veloz.</text><text x="200" y="367" font-family="Arial" font-size="17" fill="#506458">Lo observé en: __________________________</text><rect x="56" y="425" width="682" height="155" rx="18" fill="#f5f0e4"/><circle cx="130" cy="501" r="47" fill="#e6b89b"/><text x="130" y="512" text-anchor="middle" font-family="Arial" font-size="34" fill="#334d40">🦊</text><text x="200" y="473" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">ZORRO COLORADO</text><text x="200" y="507" font-family="Arial" font-size="17" fill="#506458">Mamífero adaptable que busca alimento en distintos ambientes.</text><text x="200" y="547" font-family="Arial" font-size="17" fill="#506458">Lo observé en: __________________________</text><rect x="56" y="605" width="682" height="155" rx="18" fill="#eaf1e5"/><circle cx="130" cy="681" r="47" fill="#e4d4ad"/><text x="130" y="692" text-anchor="middle" font-family="Arial" font-size="34" fill="#334d40">🐦</text><text x="200" y="653" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">CHOIQUE</text><text x="200" y="687" font-family="Arial" font-size="17" fill="#506458">Ave corredora que no vuela y recorre la estepa.</text><text x="200" y="727" font-family="Arial" font-size="17" fill="#506458">Lo observé en: __________________________</text><rect x="56" y="785" width="682" height="155" rx="18" fill="#f5f0e4"/><circle cx="130" cy="861" r="47" fill="#c8d5b8"/><text x="130" y="872" text-anchor="middle" font-family="Arial" font-size="34" fill="#334d40">🐇</text><text x="200" y="833" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">MARA</text><text x="200" y="867" font-family="Arial" font-size="17" fill="#506458">Mamífero de patas largas, propio de ambientes abiertos.</text><text x="200" y="907" font-family="Arial" font-size="17" fill="#506458">Lo observé en: __________________________</text><text x="56" y="1000" font-family="Arial" font-size="20" fill="#506458">¿Qué otros animales conocés de tu región?</text><line x1="56" y1="1040" x2="706" y2="1040" stroke="#c7d3c4" stroke-width="2"/><text x="56" y="1070" font-family="Arial,sans-serif" font-size="15" fill="#78907c">Material original de RUMA · Uso personal y educativo · Imprimible A4</text></svg>