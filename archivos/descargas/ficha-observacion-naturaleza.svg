<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title>Exploradores de la naturaleza</title><desc>Cuaderno de observación para registrar clima, plantas, huellas y hallazgos.</desc><rect width="794" height="1123" fill="#fffdf7"/><rect x="28" y="28" width="738" height="1067" rx="28" fill="none" stroke="#b7c9b3" stroke-width="3"/><circle cx="690" cy="100" r="34" fill="#f5dfad"/><path d="M670 105 Q690 60 710 105" fill="none" stroke="#7c9a82" stroke-width="4"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="18" fill="#607b68" letter-spacing="3">RUMA · RUMA ES ACCESO</text><text x="56" y="137" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#334d40">Exploradores de la naturaleza</text><line x1="56" y1="160" x2="738" y2="160" stroke="#e3c98e" stroke-width="4"/><text x="56" y="205" font-family="Arial" font-size="21" fill="#506458">Salí a mirar con curiosidad. ¡No hace falta arrancar ni llevarse nada!</text><rect x="56" y="235" width="682" height="100" rx="16" fill="#eaf1e5"/><text x="78" y="273" font-family="Arial" font-size="21" font-weight="700" fill="#334d40">Fecha y lugar</text><text x="78" y="310" font-family="Arial" font-size="18" fill="#506458">Día: ______________ Lugar: __________________________</text><rect x="56" y="350" width="682" height="100" rx="16" fill="#f9efd6"/><text x="78" y="388" font-family="Arial" font-size="21" font-weight="700" fill="#735c32">¿Cómo está el tiempo?</text><text x="78" y="425" font-family="Arial" font-size="18" fill="#735c32">☀ Sol   ☁ Nubes   ☂ Lluvia   〰 Viento</text><text x="56" y="495" font-family="Arial" font-size="22" font-weight="700" fill="#334d40">Dibujá algo que encontraste</text><rect x="56" y="515" width="682" height="230" rx="15" fill="none" stroke="#b7c9b3" stroke-width="2" stroke-dasharray="8 7"/><text x="56" y="795" font-family="Arial" font-size="22" font-weight="700" fill="#334d40">Anotá lo que observaste