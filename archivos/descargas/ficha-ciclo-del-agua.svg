<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title>El ciclo del agua</title><desc>Lámina escolar ilustrada para conocer evaporación, condensación y lluvia.</desc><rect width="794" height="1123" fill="#fffdf7"/><rect x="28" y="28" width="738" height="1067" rx="28" fill="none" stroke="#b7c9b3" stroke-width="3"/><circle cx="690" cy="100" r="34" fill="#f5dfad"/><path d="M670 105 Q690 60 710 105" fill="none" stroke="#7c9a82" stroke-width="4"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="18" fill="#607b68" letter-spacing="3">RUMA · RUMA ES ACCESO</text><text x="56" y="137" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#334d40">El ciclo del agua</text><line x1="56" y1="160" x2="738" y2="160" stroke="#e3c98e" stroke-width="4"/><text x="56" y="205" font-family="Arial" font-size="20" fill="#506458">El agua viaja, cambia y vuelve a empezar.</text><circle cx="135" cy="310" r="44" fill="#f5dfad"/><g stroke="#d8ad59" stroke-width="4"><line x1="135" y1="250" x2="135" y2="235"/><line x1="82" y1="310" x2="66" y2="310"/><line x1="188" y1="310" x2="204" y2="310"/></g><path d="M260 345 Q280 270 320 310 Q350 245 390 305 Q450 260 490 330 Q530 350 530 385 L260 385Z" fill="#dbe8ee"/><path d="M270 355 Q380 330 520 355" fill="none" stroke="#739db0" stroke-width="4"/><path d="M160 420 Q200 470 260 430" fill="none" stroke="#739db0" stroke-width="4" stroke-dasharray="8 8"/><path d="M250 418 l14 10 -15 8" fill="none" stroke="#739db0" stroke-width="4"/><rect x="56" y="490" width="682" height="115" rx="18" fill="#eaf1f5"/><text x="80" y="530" font-family="Arial" font-size="25" font-weight="700" fill="#365b70">1. Evaporación ☀</text><text x="80" y="568" font-family="Arial" font-size="19" fill="#365b70">El sol calienta el agua y parte se transforma en vapor.</text><rect x="56" y="625" width="682" height="115" rx="18" fill="#f2eaf5"/><text x="80" y="665" font-family="Arial" font-size="25" font-weight="700" fill="#655274">2. Condensación ☁</text><text x="80" y="703" font-family="Arial" font-size="19" fill="#655274">El vapor se enfría y forma pequeñas gotas en las nubes.</text><rect x="56" y="760" width="682" height="115" rx="18" fill="#eaf1e5"/><text x="80" y="800" font-family="Arial" font-size="25" font-weight="700" fill="#334d40">3. Precipitación 🌧</text><text x="80" y="838" font-family="Arial" font-size="19" fill="#334d40">El agua cae como lluvia, nieve o granizo.</text><text x="56" y="930" font-family="Arial" font-size="20" fill="#506458">¿Dónde encontrás agua en tu entorno?</text><line x1="56" y1="970" x2="706" y2="970" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="1015" x2="706" y2="1015" stroke="#c7d3c4" stroke-width="2"/><text x="56" y="1070" font-family="Arial,sans-serif" font-size="15" fill="#78907c">Material original de RUMA · Uso personal y educativo · Imprimible A4</text></svg>