<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title>Inventá tu propio cuento</title><desc>Ficha para imaginar personajes, un lugar, un problema y un final.</desc><rect width="794" height="1123" fill="#fffdf7"/><rect x="28" y="28" width="738" height="1067" rx="28" fill="none" stroke="#b7c9b3" stroke-width="3"/><circle cx="690" cy="100" r="34" fill="#f5dfad"/><path d="M670 105 Q690 60 710 105" fill="none" stroke="#7c9a82" stroke-width="4"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="18" fill="#607b68" letter-spacing="3">RUMA · RUMA ES ACCESO</text><text x="56" y="137" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#334d40">Inventá tu propio cuento</text><line x1="56" y1="160" x2="738" y2="160" stroke="#e3c98e" stroke-width="4"/><text x="56" y="205" font-family="Arial" font-size="21" fill="#506458">Mi nombre: ___________________ Fecha: ____________</text><rect x="56" y="235" width="682" height="105" rx="16" fill="#eaf1e5"/><text x="78" y="273" font-family="Arial" font-size="22" font-weight="700" fill="#334d40">1. Mi personaje</text><text x="78" y="311" font-family="Arial" font-size="18" fill="#506458">¿Quién es? ¿Qué desea?</text><rect x="56" y="355" width="682" height="105" rx="16" fill="#f9efd6"/><text x="78" y="393" font-family="Arial" font-size="22" font-weight="700" fill="#735c32">2. El lugar</text><text x="78" y="431" font-family="Arial" font-size="18" fill="#735c32">¿Dónde sucede la historia?</text><rect x="56" y="475" width="682" height="105" rx="16" fill="#eaf1f5"/><text x="78" y="513" font-family="Arial" font-size="22" font-weight="700" fill="#365b70">3. El problema</text><text x="78" y="551" font-family="Arial" font-size="18" fill="#365b70">¿Qué pasa que cambia todo?</text><text x="56" y="630" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">¡Ahora escribí tu cuento!</text><line x1="56" y1="680" x2="738" y2="680" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="728" x2="738" y2="728" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="776" x2="738" y2="776" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="824" x2="738" y2="824" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="872" x2="738" y2="872" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="920" x2="738" y2="920" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="968" x2="738" y2="968" stroke="#c7d3c4" stroke-width="2"/><line x1="56" y1="1016" x2="738" y2="1016" stroke="#c7d3c4" stroke-width="2"/><text x="56" y="1070" font-family="Arial,sans-serif" font-size="15" fill="#78907c">Material original de RUMA · Uso personal y educativo · Imprimible A4</text></svg>