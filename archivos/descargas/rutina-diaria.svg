<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 800 1131"><title>Mi rutina diaria</title><desc>Ficha simple con casilleros para organizar el día.</desc><rect width="800" height="1131" fill="#fffdf7"/><rect x="26" y="26" width="748" height="1079" rx="28" fill="none" stroke="#55785c" stroke-width="3"/><text x="60" y="145" font-family="Arial" font-size="18" font-weight="700" fill="#55785c" letter-spacing="3">RUMA · RECURSO IMPRIMIBLE</text><text x="60" y="205" font-family="Arial" font-size="34" font-weight="700" fill="#2f3e32">Mi rutina diaria</text><text x="60" y="244" font-family="Arial" font-size="18" fill="#657064">Ficha simple con casilleros para organizar el día.</text><rect x="65" y="320" width="670" height="61" rx="12" fill="#edf2e8"/><rect x="84" y="336" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="357" font-family="Arial" font-size="21" fill="#344337">Me levanto y me preparo</text><rect x="65" y="398" width="670" height="61" rx="12" fill="#f6f0e8"/><rect x="84" y="414" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="435" font-family="Arial" font-size="21" fill="#344337">Desayuno</text><rect x="65" y="476" width="670" height="61" rx="12" fill="#edf2e8"/><rect x="84" y="492" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="513" font-family="Arial" font-size="21" fill="#344337">Estudio o trabajo</text><rect x="65" y="554" width="670" height="61" rx="12" fill="#f6f0e8"/><rect x="84" y="570" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="591" font-family="Arial" font-size="21" fill="#344337">Tomo agua</text><rect x="65" y="632" width="670" height="61" rx="12" fill="#edf2e8"/><rect x="84" y="648" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="669" font-family="Arial" font-size="21" fill="#344337">Muevo el cuerpo</text><rect x="65" y="710" width="670" height="61" rx="12" fill="#f6f0e8"/><rect x="84" y="726" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="747" font-family="Arial" font-size="21" fill="#344337">Ayudo en casa</text><rect x="65" y="788" width="670" height="61" rx="12" fill="#edf2e8"/><rect x="84" y="804" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="825" font-family="Arial" font-size="21" fill="#344337">Leo un ratito</text><rect x="65" y="866" width="670" height="61" rx="12" fill="#f6f0e8"/><rect x="84" y="882" width="28" height="28" rx="6" fill="#fffdf7" stroke="#68836a" stroke-width="2"/><text x="132" y="903" font-family="Arial" font-size="21" fill="#344337">Preparo lo de mañana</text><path d="M60 1040 Q130 1007 200 1040 T340 1040 T480 1040 T620 1040 T740 1040" fill="none" stroke="#d9c9a7" stroke-width="3"/><text x="60" y="1075" font-family="Arial" font-size="15" fill="#657064">Imprimí · Usá · Compartí</text><text x="740" y="1075" text-anchor="end" font-family="Arial" font-size="15" font-weight="700" fill="#55785c">RUMA ES ACCESO</text></svg>