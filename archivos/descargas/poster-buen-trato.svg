<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title>Póster: nos tratamos bien</title><desc>Afiche para recordar el respeto, la escucha y la ayuda mutua.</desc><rect width="794" height="1123" fill="#fffdf7"/><rect x="28" y="28" width="738" height="1067" rx="28" fill="none" stroke="#b7c9b3" stroke-width="3"/><circle cx="690" cy="100" r="34" fill="#f5dfad"/><path d="M670 105 Q690 60 710 105" fill="none" stroke="#7c9a82" stroke-width="4"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="18" fill="#607b68" letter-spacing="3">RUMA · RUMA ES ACCESO</text><text x="56" y="137" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#334d40">Póster: nos tratamos bien</text><line x1="56" y1="160" x2="738" y2="160" stroke="#e3c98e" stroke-width="4"/><text x="397" y="225" text-anchor="middle" font-family="Arial" font-size="25" fill="#607b68">Una comunidad se hace entre todos</text><rect x="70" y="275" width="654" height="132" rx="22" fill="#eaf1e5"/><circle cx="132" cy="341" r="35" fill="#fffdf7" stroke="#b7c9b3" stroke-width="2"/><text x="132" y="353" text-anchor="middle" font-family="Arial" font-size="30" fill="#607b68">♡</text><text x="190" y="327" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">ESCUCHAMOS</text><text x="190" y="361" font-family="Arial" font-size="17" fill="#506458">Dejamos que cada persona pueda hablar.</text><rect x="70" y="435" width="654" height="132" rx="22" fill="#f9efd6"/><circle cx="132" cy="501" r="35" fill="#fffdf7" stroke="#b7c9b3" stroke-width="2"/><text x="132" y="513" text-anchor="middle" font-family="Arial" font-size="30" fill="#607b68">✓</text><text x="190" y="487" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">RESPETAMOS</text><text x="190" y="521" font-family="Arial" font-size="17" fill="#506458">Tratamos a los demás como queremos ser tratados.</text><rect x="70" y="595" width="654" height="132" rx="22" fill="#eaf1e5"/><circle cx="132" cy="661" r="35" fill="#fffdf7" stroke="#b7c9b3" stroke-width="2"/><text x="132" y="673" text-anchor="middle" font-family="Arial" font-size="30" fill="#607b68">＋</text><text x="190" y="647" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">AYUDAMOS</text><text x="190" y="681" font-family="Arial" font-size="17" fill="#506458">Si alguien lo necesita, buscamos cómo acompañar.</text><rect x="70" y="755" width="654" height="132" rx="22" fill="#f9efd6"/><circle cx="132" cy="821" r="35" fill="#fffdf7" stroke="#b7c9b3" stroke-width="2"/><text x="132" y="833" text-anchor="middle" font-family="Arial" font-size="30" fill="#607b68">☆</text><text x="190" y="807" font-family="Arial" font-size="24" font-weight="700" fill="#334d40">INCLUIMOS</text><text x="190" y="841" font-family="Arial" font-size="17" fill="#506458">Hay lugar para cada persona.</text><text x="397" y="960" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#334d40">Las pequeñas acciones hacen la diferencia ♡</text><text x="56" y="1070" font-family="Arial,sans-serif" font-size="15" fill="#78907c">Material original de RUMA · Uso personal y educativo · Imprimible A4</text></svg>