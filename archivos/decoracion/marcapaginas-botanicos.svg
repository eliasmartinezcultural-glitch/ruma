<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fffdf7"/><text x="397" y="75" text-anchor="middle" font-family="serif" font-size="30" fill="#456a52">Pequeños compañeros de lectura</text><text x="397" y="108" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#718b76">Imprimí, recortá y usá.</text><g fill="#f5f0df" stroke="#6d8d72" stroke-width="2"><rect x="80" y="145" width="180" height="790" rx="20"/><rect x="307" y="145" width="180" height="790" rx="20"/><rect x="534" y="145" width="180" height="790" rx="20"/></g><g fill="none" stroke="#6d8d72" stroke-width="3"><path d="M170 350Q145 285 190 230Q220 285 170 350M170 350Q120 335 118 290Q160 300 170 350M170 350Q220 320 225 280Q185 295 170 350"/><path d="M397 350Q372 285 417 230Q447 285 397 350M397 350Q347 335 345 290Q387 300 397 350M397 350Q447 320 452 280Q412 295 397 350"/><path d="M624 350Q599 285 644 230Q674 285 624 350M624 350Q574 335 572 290Q614 300 624 350M624 350Q674 320 679 280Q639 295 624 350"/></g><g font-family="serif" font-size="20" fill="#456a52" text-anchor="middle"><text x="170" y="440">Leer es</text><text x="170" y="470">viajar</text><text x="170" y="500">sin apuro.</text><text x="397" y="440">Una página</text><text x="397" y="470">más, un</text><text x="397" y="500">mundo nuevo.</text><text x="624" y="440">Guardá</text><text x="624" y="470">un ratito</text><text x="624" y="500">para leer.</text></g><g fill="none" stroke="#6d8d72" stroke-width="2"><circle cx="170" cy="820" r="48"/><circle cx="397" cy="820" r="48"/><circle cx="624" cy="820" r="48"/><path d="M170 772V868 M122 820H218 M397 772V868 M349 820H445 M624 772V868 M576 820H672"/></g><text x="397" y="1010" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#718b76">RUMA · impresión en tamaño A4</text></svg>