<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fffaf5"/><text x="397" y="75" text-anchor="middle" font-family="serif" font-size="31" fill="#936a76">Un pequeño gracias puede alegrar el día</text><g stroke="#c9a2ac" stroke-width="2" fill="#fffdf9"><rect x="65" y="120" width="315" height="390" rx="18"/><rect x="414" y="120" width="315" height="390" rx="18"/><rect x="65" y="550" width="315" height="390" rx="18"/><rect x="414" y="550" width="315" height="390" rx="18"/></g><g fill="none" stroke="#bd8496" stroke-width="3"><path d="M220 200 C180 150 130 210 220 280 C310 210 260 150 220 200Z"/><path d="M570 200 C530 150 480 210 570 280 C660 210 610 150 570 200Z"/><path d="M220 630 C180 580 130 640 220 710 C310 640 260 580 220 630Z"/><path d="M570 630 C530 580 480 640 570 710 C660 640 610 580 570 630Z"/></g><g font-family="serif" font-size="24" text-anchor="middle" fill="#936a76"><text x="220" y="330">Gracias por</text><text x="220" y="365">estar cerca.</text><text x="570" y="330">Tu ayuda</text><text x="570" y="365">vale mucho.</text><text x="220" y="760">Qué lindo</text><text x="220" y="795">compartir.</text><text x="570" y="760">Me acordé</text><text x="570" y="795">de vos.</text></g><g stroke="#dfc4ca" stroke-width="1.5"><line x1="100" y1="420" x2="345" y2="420"/><line x1="450" y1="420" x2="695" y2="420"/><line x1="100" y1="850" x2="345" y2="850"/><line x1="450" y1="850" x2="695" y2="850"/></g><text x="397" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#aa8590">Imprimí, recortá y escribí un mensaje propio.</text></svg>