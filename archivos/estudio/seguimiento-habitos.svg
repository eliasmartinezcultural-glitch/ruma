<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fffdf7"/><rect x="38" y="38" width="718" height="1047" rx="24" fill="none" stroke="#8c9bba" stroke-width="3"/><text x="397" y="100" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4d5d86">PEQUEÑOS HÁBITOS</text><text x="397" y="140" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#7785a6">No hace falta hacerlo perfecto; alcanza con empezar.</text><text x="70" y="202" font-family="sans-serif" font-size="19" fill="#4d5d86">Este mes:</text><line x1="165" y1="206" x2="720" y2="206" stroke="#b5bfd4" stroke-width="2"/><text x="70" y="253" font-family="sans-serif" font-size="18" fill="#4d5d86">Hábito que quiero cuidar:</text><line x1="290" y1="257" x2="720" y2="257" stroke="#b5bfd4" stroke-width="2"/><g fill="#4d5d86" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="310" y="308">1</text><text x="350" y="308">2</text><text x="390" y="308">3</text><text x="430" y="308">4</text><text x="470" y="308">5</text><text x="510" y="308">6</text><text x="550" y="308">7</text><text x="590" y="308">8</text><text x="630" y="308">9</text><text x="670" y="308">10</text><text x="710" y="308">11</text></g><g fill="none" stroke="#b5bfd4" stroke-width="1.5"><rect x="70" y="325" width="650" height="470" rx="8"/><path d="M285 325V795 M325 325V795 M365 325V795 M405 325V795 M445 325V795 M485 325V795 M525 325V795 M565 325V795 M605 325V795 M645 325V795 M685 325V795 M70 372H720 M70 419H720 M70 466H720 M70 513H720 M70 560H720 M70 607H720 M70 654H720 M70 701H720 M70 748H720"/></g><g font-family="sans-serif" font-size="16" fill="#64739a"><text x="85" y="355">Agua</text><text x="85" y="402">Leer</text><text x="85" y="449">Caminar</text><text x="85" y="496">Descansar</text><text x="85" y="543">Estudiar</text><text x="85" y="590">Ordenar</text><text x="85" y="637">Crear</text><text x="85" y="684">Llamar</text><text x="85" y="731">Respirar</text><text x="85" y="778">Otro</text></g><text x="70" y="850" font-family="sans-serif" font-size="20" font-weight="700" fill="#4d5d86">Algo bueno que hice por mí</text><line x1="70" y1="885" x2="720" y2="885" stroke="#b5bfd4" stroke-width="2"/><line x1="70" y1="925" x2="720" y2="925" stroke="#b5bfd4" stroke-width="2"/><text x="397" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7785a6">Los pasos pequeños también cuentan.</text></svg>