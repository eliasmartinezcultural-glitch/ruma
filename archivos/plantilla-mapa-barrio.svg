<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><title>Mapa comunitario para completar</title><desc>Material imprimible de RUMA. Descargable y apto para impresión personal.</desc><rect width="800" height="1000" fill="#FCFAF5"/><rect x="24" y="24" width="752" height="952" rx="28" fill="#E6EEDC" stroke="#D9DCCD" stroke-width="2"/><text x="55" y="90" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#33483A">Mapa comunitario para completar</text><path d="M55 115 H745" stroke="#A9B9A2" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#536458"><text x="55" y="160" class="sub">Dibujá tu zona y anotá lugares útiles con información verificada.</text><rect x="55" y="200" width="690" height="620" rx="20" fill="#FFFFFF" stroke="#C6D5BE" stroke-width="3"/><path d="M100 300 L700 720 M80 600 L700 350 M250 230 L330 800 M540 230 L470 800" stroke="#D5DFCE" stroke-width="18" stroke-linecap="round"/><path d="M100 300 L700 720 M80 600 L700 350 M250 230 L330 800 M540 230 L470 800" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12"/><text x="55" y="870" class="small">Este esquema está en blanco: completalo localmente y no lo uses como mapa oficial.</text></g><text x="55" y="940" font-family="Arial,sans-serif" font-size="16" fill="#718174">RUMA · Un lugar amable para encontrar y compartir cosas útiles</text><text x="745" y="940" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#718174">Material local · Gratis</text></svg>